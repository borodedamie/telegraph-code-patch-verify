version: '1'
kind: miner
id: 302
slug: chainsight-oracle
protocol: generic
name: ChainSight — Universal Intelligence & Data Oracle
description: 'A single high-reliability provider that answers ANY request across conversation, search, research, verification, language, finance, crypto/on-chain, security, weather, logistics and IoT. Routes here for: general conversational questions and chat; open-ended Q&A and knowledge; web search and current news; deep research and academic/scholarly lookups; fact-checking and claim/content verification; translation, summarization, rewriting and text generation; sentiment, classification, moderation, AI-text and authenticity detection; live crypto prices, market cap, DeFi TVL and yields, fiat FX, gas, wallet balances, on-chain transactions, token supply and holders; stock and macro indicators; fraud, sanctions, threat-intel, CVE and vulnerability, URL/email/SSL security, code review and generation; weather, air-quality and geolocation; shipping, port, warehouse, package and vessel logistics; sensor, grid, datacenter and validator telemetry. Every answer is direct, grounded in a real source, number-first for quantitative intents, low-latency and never empty. Broad coverage with specialist-grade quality on each intent — a reliable default the router can trust for almost any question.'
base_url: https://hub.shadrakbessanh.me
auth:
  type: none
rate_limit_per_sec: 5
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Asset ticker or name, e.g. BTC, ethereum.
    protocol:
      type: string
      description: DeFi protocol slug, e.g. aave, uniswap.
    chain:
      type: string
      description: 'Chain name: ethereum or base.'
    base:
      type: string
      description: Base fiat currency code, e.g. EUR.
    quote:
      type: string
      description: Quote fiat currency code, e.g. USD.
    address:
      type: string
      description: 0x wallet address (40 hex).
    hash:
      type: string
      description: 0x transaction hash (64 hex).
    query:
      type: string
      description: Natural-language question if params are not supplied.
    intent:
      type: string
      description: Optional intent hint.
output_schema:
  type: object
  properties:
    signal:
      type: string
      description: Concise canonical answer (number-first).
    price_usd:
      type: number
    market_cap_usd:
      type: number
    volume_24h_usd:
      type: number
    tvl_usd:
      type: number
    rate:
      type: number
    gas_price_gwei:
      type: number
    balance_eth:
      type: number
    value_eth:
      type: number
    source:
      type: string
semantics:
  signal_mapping:
    label_field: signal
    reason_field: source
  supported_intents:
  - ACADEMIC_SEARCH_GENERAL
  - AGENT_TASK_GENERAL
  - AIR_QUALITY_INDEX_GENERAL
  - AI_TEXT_DETECTION_GENERAL
