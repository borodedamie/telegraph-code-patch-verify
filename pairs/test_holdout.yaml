- ref: ho-035
  prompt: |
    gitlab-org/gitlab-shell 16cb4c8 (merge of sh-bump-crypto-source-address-fix). Pipeline 3027057625 status:
    success. 23 jobs succeeded, 1 job is manual, and code_navigation_golang failed but is marked allow_failure.
    Did this commit pass CI?
  chosen: |
    Yes. The pipeline finished with status success. code_navigation_golang is marked allow_failure, so GitLab does
    not let it fail the pipeline, and the one manual job was never required. All 23 jobs that gate the merge passed.
  rejected: |
    No. code_navigation_golang failed on 16cb4c8, and a failed job means the pipeline cannot be trusted for this
    merge; the manual job also never ran, so the crypto source-address bump is not verified by CI.
