# Question pairs for CODE_PATCH_VERIFY_GENERAL: plain questions.
# Each prompt names one finished public commit the way a user would. The better answer gives the
# verdict with evidence about that commit (pairs/evidence.jsonl, collected 2026-11-05). The worse
# answer reproduces a failure mode measured in benchmark/MINERS.md: checking another branch,
# returning metadata or a diff, a sandbox exit code, a constant verdict, or claiming more than ran.

- ref: cpv-037
  prompt: |
    Did the fastify 6.0.0-alpha.6 release commit (fastify/fastify@8c0f699) pass its CI?
  chosen: |
    Yes. On commit 8c0f699 every workflow succeeded: ci (17 jobs), ci Alternative Runtimes (5), package-manager-ci (6),
    integration, integration Alternative Runtimes, Push on main and the scheduled run. No job failed.
  rejected: |
    Yes. The latest run on fastify's main branch completed with conclusion success, and main is protected, so any
    commit on it, including the alpha release, has passed CI.

- ref: cpv-044
  prompt: |
    Can you verify typeorm/typeorm b98ef0b, "fix: preserve database identity when matching soft-delete results"?
    I need to know whether the test suite passed.
  chosen: |
    The suite passed. The Tests workflow ran all 40 jobs on b98ef0b and succeeded, and CodeQL, PR preview release,
    Pull Request and PR Triage were green as well.
  rejected: |
    Verified: commit b98ef0b exists, authored for the soft-delete identity fix, with one parent and a small diff
    touching the query builder. The change is consistent with its message, so the suite should pass.

- ref: cpv-064
  prompt: |
    fastify/fastify 0c7413a bumps the version to v5.12.8. Is that release commit green?
  chosen: |
    Green. On 0c7413a the ci workflow succeeded across its 23 jobs and the website workflow passed. Nothing failed
    on the v5.12.8 release commit.
  rejected: |
    Green: I compiled and ran a check program in the sandbox and it exited with status 0 and the expected
    output, so the build works and the release is good.

- ref: cpv-076
  prompt: |
    typeorm/typeorm@8deeb6a "fix(sqljs): calculate the id of each row after a multi-row insert" — the Tests
    workflow was re-run. What is its final result?
  chosen: |
    Final result: passed. The Tests workflow's second attempt succeeded on all 40 jobs, and CodeQL and the preview
    release also passed on attempt 2. The latest attempt is the one that counts for 8deeb6a.
  rejected: |
    Failed. The Tests workflow had to be re-run, which only happens after a failed first attempt, so the sqljs fix
    did not pass on its own merit; a pass on a retry hides the original failure.

